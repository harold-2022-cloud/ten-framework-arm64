version: "3"

dotenv: ["../../../.env"]

tasks:
  # install scripts
  install-frontend:
    desc: install frontend dependencies
    # The shared playground, like every example that does not ship a
    # frontend of its own. This one has no UI at all -- the record is a
    # file, not a page -- but `run` still brings the playground up, and a
    # `dir` that does not exist made `bun install` fail, which aborted
    # `install` before it ever reached build-api-server.
    dir: ../../../playground
    cmds:
      - bun install --verbose

  install-tenapp:
    desc: install tenapp dependencies
    dir: ./tenapp
    cmds:
      - tman install

  install-tenapp-python-deps:
    desc: install tenapp python dependencies
    deps: [install-tenapp]
    dir: ./tenapp
    cmds:
      - python scripts/install_python_deps.py

  build-api-server:
    desc: build api server
    dir: ../../../server
    cmds:
      - cmd: go mod tidy && go mod download && go build -o bin/api main.go
        platforms: [linux, darwin]
      - cmd: go mod tidy && go mod download && go build -o bin/api.exe main.go
        platforms: [windows]

  install:
    desc: install dependencies
    dir: ./tenapp
    cmds:
      - task: install-tenapp
      - task: install-tenapp-python-deps
      # Before the frontend: this graph is `auto_start: false` and POST
      # /start is the only way into it, so server/bin/api is the one thing
      # here that cannot be skipped. These run in sequence, so anything
      # that fails ahead of it takes it down with it.
      - task: build-api-server
      - task: install-frontend

  # run scripts
  run-tenapp:
    desc: run tenapp
    dir: ./tenapp
    cmds:
      - tman run start

  run-gd-server:
    desc: run tman dev http server for TMAN Designer
    dir: ./tenapp
    cmds:
      - tman designer

  run-frontend:
    desc: run frontend
    dir: ../../../playground
    cmds:
      - bun run dev

  run-api-server:
    desc: run api server
    dir: ../../../server
    cmds:
      - cmd: ./bin/api -tenapp_dir={{.PWD}}/tenapp
        platforms: [linux, darwin]
      - cmd: powershell -Command "./bin/api.exe -tenapp_dir='{{.TASKFILE_DIR}}/tenapp'"
        platforms: [windows]

  run:
    desc: run everything
    deps:
      - task: run-gd-server
      - task: run-frontend
      - task: run-api-server

  # release scripts
  release:
    desc: release
    cmds:
      - cmd: ../../scripts/release.sh {{.PWD}}/tenapp
        platforms: [linux, darwin]
      - cmd: powershell -File "../../scripts/release.ps1" -tenappDir {{.PWD}}\tenapp
        platforms: [windows]
