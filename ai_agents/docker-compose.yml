services:
  ten_agent_dev:
    # `ten_agent_build` is published for linux/amd64 only, so on an arm64 host
    # the default below runs under emulation (and the AVX2 probe in
    # agents/scripts/install_deps_and_build.sh is designed to catch exactly
    # that). To run natively on arm64, build the multi-arch dev image from
    # Dockerfile.dev (arm64 only -- see its header) and set these in
    # ai_agents/.env:
    #   TEN_AGENT_DEV_IMAGE=ten_agent_dev:local
    #   TEN_AGENT_DEV_PLATFORM=linux/arm64
    image: ${TEN_AGENT_DEV_IMAGE:-ghcr.io/ten-framework/ten_agent_build:0.7.14}
    container_name: ten_agent_dev
    platform: ${TEN_AGENT_DEV_PLATFORM:-linux/amd64}
    tty: true
    stdin_open: true
    restart: always
    ports:
      - "${GRAPH_DESIGNER_SERVER_PORT}:${GRAPH_DESIGNER_SERVER_PORT}"
      - "3000:3000"
      - 8000-9001:8000-9001
    volumes:
      - ./:/app
      - ${LOG_PATH}:${LOG_PATH}
      - ../.vscode/:/app/.vscode
      - ../tools/pylint/.pylintrc:/tools/pylint/.pylintrc
      - ../tools/upgrade:/tools/upgrade
    working_dir: /app
    env_file:
      - .env
    networks:
      - ten_agent_network
  # ten_graph_designer:
  #   image: ghcr.io/ten-framework/ten_graph_designer:4cc33b8
  #   container_name: ten_graph_designer
  #   restart: always
  #   ports:
  #     - "3001:3000"
  #   networks:
  #     - ten_agent_network
  #   environment:
  #     - TEN_DEV_SERVER_URL=http://ten_agent_dev:49483
networks:
  ten_agent_network:
    driver: bridge
